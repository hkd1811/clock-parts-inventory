function normalizeFileUrl(u) {
  const s = (u || "").trim();
  if (/^[A-Za-z]:\\/.test(s)) {
    return "file:///" + s.replace(/\\/g, "/");
  }
  return s;
}

// 이 공식 하나로 계산 가능해짐. STC1처럼 실제 오프셋이 2.5인 모델은 이 공식으로 시계판최대두께를 0.5mm 더 크게(=가공깊이를 그만큼
// 얕게) 추천할 수 있음 — 안전 마진 없이 다수값을 택한 것이니, 정말 정밀한 값이 필요하면 실측 확인 권장.
const CNC_SHAFT_TO_MAX_PANEL_OFFSET_MM = 2.0;

function deriveMovementSpec(shaftD, label) {
  const d = Number(shaftD);
  if (!d || Number.isNaN(d) || d <= 0) return null;
  return {
    model: label || `D${d}mm`,
    shaftD: d,
    maxPanelThickness: Math.max(d - CNC_SHAFT_TO_MAX_PANEL_OFFSET_MM, 0.5),
  };
}

function mergeSeeds(existing, seeds, makeEmpty, deletedKeys) {
  const existingSources = new Set(existing.map((it) => it.source).filter(Boolean));
  // source가 없는 시드(구매처 링크가 아예 없는 단종/절판 상품 등)는 model(제품명)로 중복 여부를 판단
  const existingModels = new Set(existing.map((it) => it.model).filter(Boolean));
  // 사용자가 명시적으로 삭제한 시드는(같은 source 또는 model 키로) 다시 추가하지 않음 — 삭제해도 F5하면 되살아나던 버그 수정.
  const deleted = deletedKeys || new Set();
  const seedKey = (s) => s.source || s.model;
  const toAdd = seeds
    .filter((s) => (s.source ? !existingSources.has(s.source) : s.model ? !existingModels.has(s.model) : true))
    .filter((s) => !deleted.has(seedKey(s)))
    .map((s) => ({ ...makeEmpty(), stock: 0, ...s }));
  return toAdd.length ? [...toAdd, ...existing] : existing;
}

function csvEscape(v) {
  const s = v === undefined || v === null ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function buildExportRow(item, kind) {
  if (kind === "hand") {
    return [
      item.type || "",
      item.model || "",
      "",
      item.color || "",
      item.length || "",
      "",
      "",
      "",
      "",
      "",
      item.price || "",
      item.stock || 0,
      item.drawer || "",
      item.source || "",
      item.image || "",
      item.note || "",
    ];
  }
  return [
    item.category || "무브먼트",
    item.model || "",
    item.brand || "",
    "",
    "",
    item.shaftLength || "",
    item.axisType || "",
    item.noiseType || "",
    item.pendulum ? "Y" : "",
    item.reverse ? "Y" : "",
    item.price || "",
    item.stock || 0,
    item.drawer || "",
    item.source || "",
    item.image || "",
    item.note || "",
  ];
}

function exportAllToCSV(movements, hands) {
  const byLength = (a, b) => (Number(a.length) || 0) - (Number(b.length) || 0);
  const handsA = hands.filter((h) => h.type === "A타입").sort(byLength);
  const handsB = hands.filter((h) => h.type === "B타입").sort(byLength);
  const movs = movements.filter((m) => (m.category || "무브먼트") === "무브먼트");
  const misc = movements.filter((m) => m.category === "기타");

  const rows = [
    EXPORT_COLUMNS,
    ...handsA.map((h) => buildExportRow(h, "hand")),
    ...handsB.map((h) => buildExportRow(h, "hand")),
    ...movs.map((m) => buildExportRow(m, "movement")),
    ...misc.map((m) => buildExportRow(m, "movement")),
  ];
  const csv = rows.map((r) => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `시계부속_재고_${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toMovementDraft(item, category) {
  const isFromHand = item.type !== undefined;
  const originHint = isFromHand
    ? `[원래 시계바늘: ${[item.type, item.color, item.length ? `${item.length}mm` : ""].filter(Boolean).join(" ")}] `
    : "";
  return {
    id: item.id || uid(),
    category,
    brand: !isFromHand && item.brand ? item.brand : "기타",
    shaftLength: !isFromHand && item.shaftLength ? item.shaftLength : "14mm",
    axisType: !isFromHand && item.axisType ? item.axisType : item.type === "B타입" ? "정공축" : "태양축",
    noiseType: !isFromHand && item.noiseType ? item.noiseType : "무소음",
    pendulum: Boolean(!isFromHand && item.pendulum),
    reverse: Boolean(!isFromHand && item.reverse),
    price: item.price || "",
    source: item.source || "",
    image: item.image || "",
    stock: item.stock || 0,
    drawer: item.drawer || "",
    note: isFromHand ? originHint + (item.note || "") : item.note || "",
  };
}

const LS_PREFIX = "cp_ledger_";

async function loadAll() {
  const keys = ["movements", "hands", "transactions", "infoItems", "deletedSeedKeys"];
  const out = {};
  for (const k of keys) {
    try {
      const raw = localStorage.getItem(LS_PREFIX + k);
      out[k] = raw ? JSON.parse(raw) : [];
    } catch {
      out[k] = [];
    }
  }
  return out;
}

async function saveKey(key, value) {
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error("storage save failed", key, e);
  }
}

}

function buildRegistrationConfirmMessage(f, fieldDefs, duplicate, kind) {
  const filled = [];

  fieldDefs.forEach(({ key, label }) => {

    (has ? filled : missing).push(label);

  let msg = duplicate
    ? `⚠️ 같은 구매처 링크로 이미 등록된 상품이 있어요!\n(${describeItemShort(duplicate, kind)})\n\n재고만 늘리려는 거라면 취소하고 해당 항목의 "수정"에서 입출고해주세요.\n\n그래도 새로 등록할까요?\n\n`
    : `이 내용으로 새로 등록할까요?\n\n`;
  msg += `찾은 정보 (${filled.length}건): ${filled.join(", ") || "없음"}`;
  if (missing.length) {
    msg += `\n\n못 찾은 정보 (${missing.length}건): ${missing.join(", ")} — 등록 후 직접 입력해주세요.`;

  return msg;
}

const SHAFT_LENGTH_MIN = 4;
const SHAFT_LENGTH_MAX = 24;

function MovementForm({ initial, onSave, onCancel, isEdit = false, existingItems = [] }) {
  const [f, setF] = useState(initial);
  const [shaftGuideOpen, setShaftGuideOpen] = useState(false);
  const set = (k) => (e) =>
    setF((s) => ({ ...s, [k]: e.target && e.target.type === "checkbox" ? e.target.checked : e.target.value }));

  // 샤프트 길이 — 자유 입력(4~24mm 정수)이지만, blur/Enter 시점에만 clamp해서 커밋(매 키 입력마다 clamp하면
  // 두 자리 수를 직접 타이핑할 때 첫 자리만으로 범위를 벗어나 튕겨나가는 문제가 있었음 — v68 가공계산기에서 발견/해결한 패턴 재사용)
  const [shaftLengthRaw, setShaftLengthRaw] = useState(() => {
    const n = parseInt(initial.shaftLength, 10);
    return Number.isNaN(n) ? "" : String(n);
  });
  const commitShaftLength = () => {
    const n = Math.round(Number(shaftLengthRaw));
    if (shaftLengthRaw.trim() === "" || Number.isNaN(n)) {
      const fallback = parseInt(f.shaftLength, 10) || SHAFT_LENGTH_MIN;
      setShaftLengthRaw(String(fallback));
      return;
    }
    const clamped = Math.min(SHAFT_LENGTH_MAX, Math.max(SHAFT_LENGTH_MIN, n));
    setShaftLengthRaw(String(clamped));
    setF((s) => ({ ...s, shaftLength: `${clamped}mm` }));
  };

  const handleSaveClick = () => {
    const dup = isEdit ? null : findDuplicateBySource(f.source, existingItems);
    const fields = f.category === "기타" ? MISC_SUMMARY_FIELDS : MOVEMENT_SUMMARY_FIELDS;

    onSave(f);

function InfoItemForm({ initial, onSave, onCancel, isEdit = false, infoItems = [] }) {
  const [f, setF] = useState(initial);
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);
  const set = (k) => (e) => setF((s) => ({ ...s, [k]: e.target.value }));

  // 신규 등록일 때만: 종류를 고를 때마다 "같은 종류 등록건수 + 1"을 중요도 기본값으로 채워줌
  useEffect(() => {
    if (isEdit) return;
    const count = infoItems.filter((i) => i.kind === f.kind).length;
    setF((s) => ({ ...s, priority: count + 1 }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [f.kind, isEdit]);

  const handleDocFile = async (file) => {
    if (!file) return;
    const MAX_WARN_BYTES = 3 * 1024 * 1024;
    if (file.size > MAX_WARN_BYTES) {
      const mb = (file.size / (1024 * 1024)).toFixed(1);
      if (
        !window.confirm(
          `선택한 파일이 ${mb}MB로 꽤 커요. 이대로 첨부하면 앱 저장공간을 많이 차지해서 느려질 수 있어요.\n\n그래도 첨부할까요? (파일을 다른 곳에 올려두고 링크만 등록하는 방법도 있어요)`
        )
      )
        return;
    }
    setBusy(true);
    try {
      const dataUrl = await fileToDataUrl(file);
      setF((s) => ({ ...s, url: dataUrl, fileName: file.name }));
    } catch (e) {
      window.alert("파일을 읽지 못했어요.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="grid grid-cols-2 gap-3 p-4 rounded-lg border bg-[#FBF7EF]" style={{ borderColor: "#BFAE8C" }}>
      <Field label="종류">
        <select className={inputCls} style={inputStyle} value={f.kind} onChange={(e) => setF((s) => ({ ...s, kind: e.target.value }))}>
          {INFO_KINDS.map((k) => (
            <option key={k}>{k}</option>
          ))}
        </select>
      </Field>
      <Field label="중요도">
        <input className={inputCls} style={inputStyle} type="number" value={f.priority} onChange={set("priority")} />
      </Field>
      <div className="col-span-2">
        <Field label="제목">
          <input className={inputCls} style={inputStyle} placeholder="예: 샤프트 크기 비교 매뉴얼" value={f.title} onChange={set("title")} />
        </Field>
      </div>
      <div className="col-span-2">

/* ---------------------------- GitHub upload ---------------------------- */

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result || "";
      const base64 = String(result).split(",")[1] || "";
      resolve(base64);
    };
    reader.onerror = () => reject(new Error("파일을 읽지 못했어요."));
    reader.readAsDataURL(file);
  });
}

// Info 탭 문서 첨부용 — mime 타입이 포함된 완전한 data URL을 그대로 반환(첨부 파일을 링크 클릭만으로 열 수 있게)
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("파일을 읽지 못했어요."));
    reader.readAsDataURL(file);
  });
}

function resizeImageToDataUrl(file, { maxDim = 1000, quality = 0.82 } = {}) {
  return new Promise((resolve) => {
    const fallback = () => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => resolve("");
      reader.readAsDataURL(file);
    };
    try {
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try {
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch {
          fallback();
        }
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        fallback();
      };
      img.src = objectUrl;
    } catch {
      fallback();
    }
  });
}

async function githubUploadImage(settings, file) {
  const { owner, repo, token, branch } = settings;
  if (!owner || !repo || !token) {
    throw new Error("GitHub 설정(계정/저장소/토큰)이 비어있어요. 설정 버튼을 눌러 입력해주세요.");
  }
  const base64 = await fileToBase64(file);
  const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || "");
  const ext = (extMatch ? extMatch[1] : "jpg").toLowerCase();
  const filename = `img_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const path = `images/${filename}`;
  const branchName = branch || "main";

  const res = await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/${path}`,
    {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        message: `Add ${filename} via AI등록`,
        content: base64,
        branch: branchName,
      }),
    }
  );
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error(`GitHub 업로드 실패 (${res.status}). ${t.slice(0, 200)}`);
  }
  return `https://raw.githubusercontent.com/${owner}/${repo}/${branchName}/${path}`;
}

/* ---------------------------- GitHub 데이터 동기화 (재고 원장 JSON) ---------------------------- */
/* 이미지 업로드(githubUploadImage)와 같은 GitHub 연결 설정(owner/repo/token)을 재사용해서,
   movements/hands/transactions/infoItems/deletedSeedKeys를 저장소의 JSON 파일 하나로 동기화한다.
   "한 번에 한 기기만 사용"을 전제로 한 단순 모델: 열 때 최신을 받아오고(pull), 저장할 때마다 올린다(push).
   토큰(github_settings)은 이 파일에 절대 포함하지 않음 — 커밋 이력에 비밀값이 남는 걸 방지. */

const LEDGER_SYNC_PATH = "data/ledger.json";

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => (binary += String.fromCharCode(b)));
  return btoa(binary);
}

function base64ToUtf8(str) {
  const binary = atob(str.replace(/\n/g, ""));
  const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

async function githubFetchLedger(settings) {
  const { owner, repo, token, branch } = settings;
  if (!owner || !repo || !token) return { data: null, sha: null };
  const branchName = branch || "main";
  const res = await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/${LEDGER_SYNC_PATH}?ref=${branchName}`,
    { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } }
  );
  if (res.status === 404) return { data: null, sha: null };
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    const err = new Error(`GitHub 데이터 불러오기 실패 (${res.status}). ${t.slice(0, 200)}`);
    err.status = res.status;
    throw err;
  }
  const json = await res.json();
  // Contents API는 1MB 넘는 파일이면 content를 안 담아서 줌(encoding:"none") — 그럴 땐 Git Blobs API에서 직접 받아옴.
  // (raw.githubusercontent.com/download_url은 CDN 캐시를 타서 커밋 직후에도 몇 분간 옛 내용을 주는 문제가 있었음 —
  // 쿼리스트링을 바꿔도 이 CDN은 그걸 무시하고 캐시된 응답을 그대로 줌(X-Cache: HIT로 확인). Git Blobs API는 캐시 없이
  // sha로 정확한 내용을 즉시 줌.)
  let text;
  if (json.encoding === "base64" && json.content) {
    text = base64ToUtf8(json.content);
  } else {
    const blobRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/blobs/${json.sha}`, {
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" },
    });
    if (!blobRes.ok) {
      const t = await blobRes.text().catch(() => "");
      const err = new Error(`GitHub 원본 데이터 불러오기 실패 (${blobRes.status}). ${t.slice(0, 200)}`);
      err.status = blobRes.status;
      throw err;
    }
    const blobJson = await blobRes.json();
    text = base64ToUtf8(blobJson.content);
  }
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error("GitHub에 저장된 데이터 형식이 올바르지 않아요.");
  }
  return { data: parsed, sha: json.sha };
}

async function githubPushLedger(settings, ledgerData, sha) {
  const { owner, repo, token, branch } = settings;
  if (!owner || !repo || !token) {
    throw new Error("GitHub 설정(계정/저장소/토큰)이 비어있어요. 설정 버튼을 눌러 입력해주세요.");
  }
  const branchName = branch || "main";
  const body = {
    message: `재고 데이터 동기화 - ${new Date().toISOString()}`,
    content: utf8ToBase64(JSON.stringify(ledgerData, null, 2)),
    branch: branchName,
  };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${LEDGER_SYNC_PATH}`, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    const err = new Error(`GitHub 데이터 저장 실패 (${res.status}). ${t.slice(0, 200)}`);
    err.status = res.status;
    throw err;
  }
  const json = await res.json();
  return json.content.sha;
}

/* ---------------------------- Image Source Picker ---------------------------- */
/* 붙여넣기(클립보드) / 파일 업로드(드래그 포함) / URL 직접입력 / GitHub 갤러리 선택을
   한 곳에서 지원하는 공용 이미지 입력 컴포넌트.
   GitHub 연동(owner/repo/token)이 있으면 백그라운드로 업로드해 짧은 URL로 승격시키고,
   없으면 리사이즈한 base64 데이터 URL을 그대로 값으로 사용한다(항상 동작 보장). */

function ImageSourcePicker({ value, onChange, label = "이미지" }) {
  const gh = React.useContext(GithubSettingsContext);
  const ghReady = Boolean(gh.owner && gh.repo);
  const uploadReady = Boolean(gh.owner && gh.repo && gh.token);

  const [urlText, setUrlText] = useState(value && value.startsWith("http") ? value : "");
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState("");
  const [galleryOpen, setGalleryOpen] = useState(false);
  const [gallery, setGallery] = useState([]);
  const [galleryLoading, setGalleryLoading] = useState(false);
  const [galleryError, setGalleryError] = useState("");
  const fileInputRef = useRef(null);

  useEffect(() => {
    setUrlText(value && value.startsWith("http") ? value : "");
  }, [value]);

  const handleBlob = useCallback(
    async (blob) => {
      if (!blob || !blob.type || !blob.type.startsWith("image/")) {
        setError("이미지 파일이 아니에요.");
        return;
      }
      setError("");
      const ext = (blob.type.split("/")[1] || "png").toLowerCase();
      const namedFile = blob.name ? blob : new File([blob], `pasted.${ext}`, { type: blob.type });

      const dataUrl = await resizeImageToDataUrl(namedFile);
      if (dataUrl) onChange(dataUrl);

      if (uploadReady) {
        setUploading(true);
        try {
          const url = await githubUploadImage(gh, namedFile);
          onChange(url);
        } catch (e) {
          setError((e && e.message) || "GitHub 업로드 실패 — 이미지는 이 기기에 직접 저장됐어요.");
        } finally {
          setUploading(false);
        }
      }
    },
    [gh, uploadReady, onChange]
  );

  // 등록/수정 폼이 열려있는 동안엔 화면 어디를 클릭했든 Ctrl+V로 바로 이미지가 붙여넣기 되도록
  useEffect(() => {
    const handler = (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.kind === "file" && item.type && item.type.startsWith("image/")) {
          e.preventDefault();
          const blob = item.getAsFile();
          if (blob) handleBlob(blob);
          return;
        }
      }
    };
    window.addEventListener("paste", handler);
    return () => window.removeEventListener("paste", handler);
  }, [handleBlob]);

  const onPaste = (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.kind === "file" && item.type && item.type.startsWith("image/")) {
        e.preventDefault();
        const blob = item.getAsFile();
        if (blob) handleBlob(blob);
        return;
      }
    }
  };

  const onDrop = (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && file.type && file.type.startsWith("image/")) handleBlob(file);
    else setError("이미지 파일이 아니에요.");
  };

  const loadGallery = useCallback(async () => {
    if (!ghReady) return;
    setGalleryLoading(true);
    setGalleryError("");
    try {
      const res = await fetch(
        `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/images?ref=${gh.branch || "main"}`,
        {
          headers: {
            Accept: "application/vnd.github+json",
            ...(gh.token ? { Authorization: `Bearer ${gh.token}` } : {}),
          },
        }
      );
      if (!res.ok) throw new Error(`목록을 못 가져왔어요 (${res.status})`);
      const data = await res.json();
      const files = (Array.isArray(data) ? data : [])
        .filter((f) => f.type === "file" && /\.(jpe?g|png|gif|webp)$/i.test(f.name))
        .map((f) => ({ name: f.name, downloadUrl: f.download_url, sha: f.sha }))
        .sort((a, b) => (a.name < b.name ? 1 : -1));
      setGallery(files);
    } catch (e) {
      setGalleryError(e.message || "GitHub 이미지 목록을 불러오지 못했어요.");
    } finally {
      setGalleryLoading(false);
    }
  }, [ghReady, gh]);

  const toggleGallery = () => {
    const next = !galleryOpen;
    setGalleryOpen(next);
    if (next && gallery.length === 0) loadGallery();
  };

  const statusNote = value
    ? value.startsWith("data:")
      ? "브라우저에 직접 저장됨(용량 절약을 위해 축소됨)"
      : value.includes("raw.githubusercontent.com")
      ? "GitHub에 저장됨"
      : "외부 URL 사용 중"
    : "";

  return (
    <div className="flex flex-col gap-2">
      <span className="text-sm font-medium" style={{ color: "#463823" }}>
        {label}
      </span>
      <div className="flex gap-3 items-start">
        <ImgThumb src={value} alt={label} size={72} />
        <div className="flex-1 min-w-0 flex flex-col gap-2">
          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            className="hidden"
            onChange={(e) => {
              const f = e.target.files && e.target.files[0];
              if (f) handleBlob(f);
              e.target.value = "";
            }}
          />
          <div
            tabIndex={0}
            onPaste={onPaste}
            onDrop={onDrop}
            onDragOver={(e) => e.preventDefault()}
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            className="flex items-center justify-center gap-1.5 py-2.5 rounded border-2 border-dashed cursor-pointer text-center outline-none focus:ring-2"
            style={{ borderColor: "#BFAE8C", backgroundColor: "#FBF7EF" }}
          >
            <ClipboardPaste size={15} className="text-[#7A5230]" />
            <span className="text-xs" style={{ color: "#463823" }}>
              클릭해서 파일 선택 · 이 화면 아무 곳에서나 Ctrl+V로 붙여넣기 · 끌어놓기
            </span>
          </div>
          <input
            className={inputCls}
            style={inputStyle}
            placeholder="https://... (URL 직접 입력)"
            value={urlText}
            onChange={(e) => {

  const [status, setStatus] = useState("idle"); // idle | error | ready

  const ghReady = Boolean(githubSettings.owner && githubSettings.repo);

  const CLOCKPOINT_BASE = "http://www.clockpoint.co.kr/goods/goods_view.php?goodsNo=";

  const handleImageChange = (url) => {
    setImageUrl(url);

    const isHandKind = kindGuess === "A타입" || kindGuess === "B타입";

      setDraft({
        kind: "movement",

          ...emptyMovement(kindGuess),

    } else {

        kind: "hand",
        base: {
          ...emptyHand(),

          color: colorGuess,

    setStatus("ready");
    setStatusMsg("이미지와 링크를 등록했어요. 아래에서 상세 정보를 직접 입력해주세요.");

        >

          <button onClick={onOpenSettings} className="underline font-medium">
            설정하기
          </button>
        </div>
      )}

      {!draft && (
        <div className="flex flex-col gap-3 p-4 rounded-lg border bg-white/70" style={{ borderColor: "#BFAE8C" }}>
          <Field label="분류">
            <div className="flex gap-2 flex-wrap">
              {["A타입", "B타입", "무브먼트", "기타"].map((c) => (
                <button
                  key={c}
                  onClick={() => setKindGuess(c)}
                  className="flex-1 py-1.5 rounded text-sm border min-w-[70px]"
                  style={
                    kindGuess === c
                      ? { backgroundColor: "#7A5230", color: "white", borderColor: "#7A5230" }
                      : { borderColor: "#BFAE8C", color: "#463823" }
                  }
                >
                  {c}
                </button>
              ))}
            </div>
          </Field>

          <ImageSourcePicker value={imageUrl} onChange={handleImageChange} label="이미지" />

          <Field label="웹사이트 링크 (goodsNo 파일이면 자동 채워짐)">
            <input
              className={inputCls}
              style={inputStyle}
              placeholder="https://..."
              value={link}
              onChange={(e) => setLink(e.target.value)}
            />
          </Field>

          {(kindGuess === "A타입" || kindGuess === "B타입") && (
            <Field label="색상 (같은 상품이라도 사이트에서 색상별로 따로 구매하는 경우가 많아요)">

                  <option key={c}>{c}</option>
                ))}

          <button
            onClick={handleRegister}

            style={{ backgroundColor: "#7A5230" }}

            <Link2 size={15} />
            등록 진행

          {statusMsg && status === "error" && (

              <AlertTriangle size={13} /> {statusMsg}

      )}

      {draft && (
        <div className="flex flex-col gap-2">

            className="text-xs px-3 py-2 rounded flex items-center gap-2"

              existingItems={existingMovements}

                reset();
              }}

          ) : (

              initial={draft.base}
              existingItems={existingHands}

                reset();
              }}

            />
          )}
        </div>
      )}
    </div>
  );

const CNC_DIAGRAM_MARGIN_MM = 25; // 무브먼트 양옆 여유폭(참고 이미지 비율 기준, 고정값)
const CNC_SHAFT_WIDTH_MM = 8;
const CNC_HOLE_CLEARANCE_MM = 2; // 조립 여유 — 관통홀은 샤프트 지름보다 이만큼 더 크게 뚫어야 함(예: 샤프트 6mm → 홀 8mm)
const CNC_TOP_FIXED_PX = 105; // 나무판 윗면(시계판/앞면) y좌표 자체는 고정 기준점 — 판재두께/가공깊이가 바뀌어도 이 좌표는 절대 안 움직임.
// 판재두께(T)와 무관한 고정 배율. 예전엔 T에 따라 pxPerMm이 달라지고, 그걸 다시 CSS width로 눌러 맞추는 이중 스케일링 때문에
// 화면상 originY(윗면)까지의 실제 픽셀 거리가 T마다 달라져서 "이미지가 가라앉는" 것처럼 보였음 — 배율을 고정하고 SVG를 원본 크기 그대로
// 렌더링(CSS width로 다시 축소하지 않음)하면 원점의 화면 좌표가 항상 동일해짐. 프레임 20% 확장에 맞춰 106mm 보드폭이 약 432px가 되도록 설정.
const CNC_PX_PER_MM = 3.7;

// VBA 스핀버튼 스타일 — 값 입력칸 + 위/아래 버튼(클릭당 step만큼 증감)
// 입력칸은 로컬 버퍼(raw)에 자유롭게 타이핑하게 하고, blur/Enter 시점에만 clamp해서 커밋한다.
// (매 키 입력마다 즉시 clamp하면, 예를 들어 "30"을 입력할 때 첫 글자 "3"만으로도 min/max에 걸려 튕겨나가면서
//  자릿수가 긴 값을 직접 타이핑으로 입력할 수 없게 되는 버그가 있었음 — 스핀 버튼(▲▼)은 그대로 즉시 clamp)
function CncSpinField({ label, value, onChange, min, max, step = 0.5 }) {
  const locked = min !== undefined && max !== undefined && max - min < step / 2;
  const [raw, setRaw] = useState(String(value));
  useEffect(() => {
    setRaw(String(value));
  }, [value]);

  const clamp = (v) => {
    let n = Math.round(v / step) * step;
    if (min !== undefined) n = Math.max(n, min);
    if (max !== undefined) n = Math.min(n, max);
    return Math.round(n * 10) / 10;
  };

  const commitRaw = () => {
    const n = Number(raw);
    if (raw.trim() !== "" && !Number.isNaN(n)) {
      onChange(clamp(n));
    } else {
      setRaw(String(value));
    }
  };

  return (
    <div className="flex flex-col items-center gap-1 shrink-0">
      <span className="text-[18px] font-semibold text-center" style={{ color: "#463823" }}>
        {label}
      </span>
      <input
        type="text"
        inputMode="decimal"
        className="w-16 text-center text-sm rounded border py-1"
        style={{ borderColor: "#BFAE8C" }}
        value={raw}
        onChange={(e) => setRaw(e.target.value)}
        onBlur={commitRaw}
        onKeyDown={(e) => {
          if (e.key === "Enter") {
            commitRaw();
            e.target.blur();
          }
        }}
      />
      <div className="flex flex-col rounded border overflow-hidden" style={{ borderColor: "#BFAE8C", width: 28 }}>
        <button
          type="button"
          disabled={locked}
          onClick={() => onChange(clamp(value + step))}
          className="text-[10px] leading-none py-1.5"
          style={{
            backgroundColor: "#EAE1CE",
            color: "#463823",
            borderBottom: "1px solid #BFAE8C",
            opacity: locked ? 0.35 : 1,
            cursor: locked ? "not-allowed" : "pointer",
          }}
        >
          ▲
        </button>
        <button
          type="button"
          disabled={locked}
          onClick={() => onChange(clamp(value - step))}
          className="text-[10px] leading-none py-1.5"
          style={{ backgroundColor: "#EAE1CE", color: "#463823", opacity: locked ? 0.35 : 1, cursor: locked ? "not-allowed" : "pointer" }}
        >
          ▼
        </button>
      </div>
      <span className="text-[18px]" style={{ color: "#4F4030" }}>
        mm (0.5씩)
      </span>
    </div>
  );
}

function CncPocketDiagram({ T, depth, protrusion, spec }) {
  const pxPerMm = CNC_PX_PER_MM;
  const movementWidthMm = MOVEMENT_SPEC_COMMON.bodySize;
  const bodyDepthMm = MOVEMENT_SPEC_COMMON.bodyDepth;
  const boardWidthMm = movementWidthMm + CNC_DIAGRAM_MARGIN_MM * 2;
  const boardWidthPx = boardWidthMm * pxPerMm;
  const boardHeightPx = T * pxPerMm;
  const overhangMm = Math.max(bodyDepthMm - depth, 0);
  const overhangPx = overhangMm * pxPerMm;

  const leftPad = 20;
  const rightPad = 20;
  const topPad = CNC_TOP_FIXED_PX; // 고정 — T/depth와 무관하게 항상 동일
  const bottomPad = overhangPx + 20; // 아래쪽만 가변

  const originX = leftPad;
  const originY = topPad;

  const pocketX = originX + CNC_DIAGRAM_MARGIN_MM * pxPerMm;
  const pocketY = originY + (T - depth) * pxPerMm;
  const pocketW = movementWidthMm * pxPerMm;
  const pocketH = depth * pxPerMm;

  const movementDrawW = movementWidthMm * 0.82 * 1.1 * pxPerMm; // 가로 길이 10% 확대
  const movementX = pocketX + (pocketW - movementDrawW) / 2;
  const movementH = bodyDepthMm * pxPerMm;

  const shaftW = CNC_SHAFT_WIDTH_MM * pxPerMm;
  const shaftX = originX + boardWidthPx / 2 - shaftW / 2;
  // 표면 위 축 길이(Gap) = protrusion(mm) × 고정 배율(pxPerMm, 이제 보드와 동일한 상수라 T와 완전히 무관) —
  // 같은 모델에서 나무두께만 바뀌어도 depth가 자동 재조정되어 protrusion 실측값이 그대로 유지되고, 화면에도 그대로 반영된다.
  const shaftAboveOriginPx = Math.max(protrusion * pxPerMm, 6);
  const shaftTopY = originY - shaftAboveOriginPx;
  const shaftBottomY = pocketY;

  // 관통홀 — 샤프트가 실제로 나무(시계판 잔여벽)를 뚫고 지나가는 구간[originY, pocketY]에서만, 샤프트보다 여유(clearance)만큼 더 넓게.
  // 조립 가능하려면 홀이 샤프트보다 커야 하는데, 기존엔 축과 나무 사이에 여백이 전혀 없이(=지름이 똑같이) 그려져서 오해를 줬음.
  const holeWpx = (CNC_SHAFT_WIDTH_MM + CNC_HOLE_CLEARANCE_MM) * pxPerMm;
  const holeX = shaftX - (holeWpx - shaftW) / 2;
  const holeY = originY;
  const holeH = Math.max(pocketY - originY, 0);

  // 시침/분침 고정 브래킷 — 반드시 샤프트(8mm)보다 좁아야 나무 관통홀을 통과해 조립 가능하다는 지적 반영.
  // 아래(시침용) 5mm×3mm, 위(분침용) 3.1mm×3mm, 둘 다 shaftW보다 작은 실측 mm값을 같은 pxPerMm으로 스케일링.
  const lowerBracketW = 5 * pxPerMm; // 시침용
  const lowerBracketH = 3 * pxPerMm;
  const upperBracketW = 3.1 * pxPerMm; // 분침용
  const upperBracketH = 3 * pxPerMm;
  const shaftCenterX = shaftX + shaftW / 2;
  const lowerBracketX = shaftCenterX - lowerBracketW / 2;
  const lowerBracketY = shaftTopY - lowerBracketH; // 샤프트 바로 위
  const upperBracketX = shaftCenterX - upperBracketW / 2;
  const upperBracketY = lowerBracketY - upperBracketH; // 아래 브래킷에 간격 0으로 붙여서 쌓음
  const handThickness = 3.75;
  const hourHandY = lowerBracketY + lowerBracketH / 2 - handThickness / 2; // 시침 — 아래 브래킷 세로 정중앙
  const minuteHandY = upperBracketY + upperBracketH / 2 - handThickness / 2; // 분침 — 위 브래킷 세로 정중앙

  const viewW = leftPad + boardWidthPx + rightPad;
  const viewH = topPad + boardHeightPx + bottomPad;

  return (
    <svg viewBox={`0 0 ${viewW} ${viewH}`} className="shrink-0" style={{ width: viewW, height: viewH, maxWidth: "100%" }}>
      {/* 나무 판재 (양옆 노란 블록, 전체 두께) */}
      <rect x={originX} y={originY} width={boardWidthPx} height={boardHeightPx} fill="#F5C518" stroke="#2B2420" strokeWidth="1.5" />
      {/* 관통홀(흰 여백) — 샤프트가 시계판을 뚫는 구간만, 샤프트보다 조립 여유만큼 넓게 */}
      {holeH > 0 && <rect x={holeX} y={holeY} width={holeWpx} height={holeH} fill="#FBF7EF" />}
      {/* CNC 포켓(뒷면에서 파낸 부분) */}
      {pocketH > 0 && (
        <rect x={pocketX} y={pocketY} width={pocketW} height={pocketH} fill="#FBF7EF" stroke="#BFAE8C" strokeDasharray="4 3" strokeWidth="1" />
      )}
      {/* 축 (표면 위로 실제 돌출량만큼) */}
      <rect x={shaftX} y={shaftTopY} width={shaftW} height={Math.max(shaftBottomY - shaftTopY, 0)} fill="#D64545" />
      {/* 나사산 — 축 위에 일정 간격으로 홈 표시(스크류 느낌) */}
      {(() => {
        const threadPitch = 4.5;
        const lines = [];
        for (let y = shaftTopY + threadPitch; y < shaftBottomY; y += threadPitch) {
          lines.push(y);
        }
        return lines.map((y, i) => (
          <line key={i} x1={shaftX} y1={y} x2={shaftX + shaftW} y2={y} stroke="#8A2E2E" strokeWidth="1" />
        ));
      })()}
      {/* 시침/분침 고정 브래킷 — 실측 mm 스펙(5×3mm, 3.1×3mm), 둘 다 샤프트(8mm)보다 좁아 관통홀 통과 가능 */}
      <rect x={lowerBracketX} y={lowerBracketY} width={lowerBracketW} height={lowerBracketH} fill="#FBF7EF" stroke="#1A1A1A" strokeWidth="1.5" />
      <rect x={upperBracketX} y={upperBracketY} width={upperBracketW} height={upperBracketH} fill="#FBF7EF" stroke="#1A1A1A" strokeWidth="1.5" />
      {/* 분침(긴 바늘, 위) — 위 브래킷 세로 정중앙 */}
      <rect x={shaftX - 10} y={minuteHandY} width={218.75} height={handThickness} fill="#1A1A1A" />
      {/* 시침(짧은 바늘, 아래) — 아래 브래킷 세로 정중앙 */}
      <rect x={shaftX - 10} y={hourHandY} width={112.5} height={handThickness} fill="#1A1A1A" />
      {/* 무브먼트 몸체 — 포켓이 없어도(얇은 판재) 항상 표시: 이 경우 뒷면에 그대로 걸쳐 튀어나온 모습으로 그려짐 */}
      <rect x={movementX} y={pocketY} width={movementDrawW} height={movementH} rx={Math.min(10, movementDrawW / 6)} fill="#46484C" />
      <text
        x={movementX + movementDrawW / 2}
        y={pocketY + movementH / 2}
        fontSize={Math.max(10, Math.min(movementH * 0.32, (movementDrawW * 0.85) / Math.max(spec.model.length * 0.58, 1)))}
        fontWeight="700"
        fill="#FFFFFF"
        textAnchor="middle"
        dominantBaseline="middle"
      >
        {spec.model}
      </text>
    </svg>
  );
}

function CncCalcSection({ movements }) {
  // 탭을 열자마자 다이어그램이 바로 보이도록, 목록의 첫 번째(추시계 제외) 무브먼트를 기본 선택으로.
  // CncCalcSection은 "가공계산기" 탭으로 전환될 때마다 새로 마운트되므로(부모의 {tab==="cnc" && ...} 조건부 렌더),
  // 이 초기값 계산은 매번 탭 진입 시 자연스럽게 다시 실행된다.
  const [inventoryId, setInventoryId] = useState(() => {
    const first = movements.find((m) => m.category === "무브먼트" && !m.pendulum);
    return first ? first.id : "";
  });
  const [panelThickness, setPanelThickness] = useState(14 - CNC_SHAFT_TO_MAX_PANEL_OFFSET_MM);
  const [depth, setDepth] = useState(0);

  // 추시계(pendulum)는 이 계산과 무관한 별도 카테고리라 목록에서 제외
  const inventoryMovements = useMemo(() => movements.filter((m) => m.category === "무브먼트" && !m.pendulum), [movements]);
  const selectedInventoryItem = inventoryMovements.find((m) => m.id === inventoryId) || null;
  const spec = selectedInventoryItem
    ? deriveMovementSpec(parseFloat(selectedInventoryItem.shaftLength), selectedInventoryItem.model || selectedInventoryItem.brand)
    : null;
  // 이펙트 의존성용 — spec은 매 렌더마다 새로 계산되는 객체라 참조가 안 바뀌므로, 실제 "선택이 바뀌었는지"는 이 값으로 판단
  const specIdentity = inventoryId;

  const T_MIN = 4;
  const T_MAX = 42;
  const T = Math.min(T_MAX, Math.max(Number(panelThickness) || 0, T_MIN));
  const recommendedDepth = spec ? Math.max(T - spec.maxPanelThickness, 0) : 0;

  // 선택(샤프트 길이 or 재고 무브먼트)이 바뀌면 나무두께를 그 스펙의 최적 조건(=시계판 최대두께)으로 자동 설정
  useEffect(() => {
    if (spec) setPanelThickness(spec.maxPanelThickness);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [specIdentity]);

  // 판재두께가 바뀌면 가공깊이를 추천값으로 리셋 — 그 전까지는 사용자가 스핀버튼으로 자유롭게 조절 가능(시뮬레이션)
  useEffect(() => {
    setDepth(recommendedDepth);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [T, specIdentity]);

  // 가공깊이 스핀버튼 자체의 상하한을 나무두께/모델 스펙에 맞춰 미리 계산 — "작동금지"를 경고문 대신 애초에 선택 불가능하게 만드는 방식.
  // 하한: 축 돌출 추정값이 0mm(=축이 표면까지 안 닿음)이 되지 않도록 최소 0.5mm는 항상 돌출되게.
  // 상한: 시계판 두께(잔여)가 4mm 이하로 얇아지지 않도록(안전 최소치) 최소 4.5mm는 항상 남게.
  const MIN_WALL_MM = 4;
  const depthMinRaw = spec ? T - spec.shaftD + 0.5 : 0; // 0보다 클 때만 "진짜" 하한 제약(돌출 0mm 방지) — 음수면 그냥 0(가공 안 함)이 자연스러운 하한일 뿐, 경고 대상 아님
  const depthMinBound = Math.max(0, depthMinRaw);
  const depthMaxBound = spec ? Math.min(T, Math.max(depthMinBound, T - MIN_WALL_MM - 0.5)) : T;

  const depthClamped = Math.min(Math.max(depth, depthMinBound), depthMaxBound);
  const atMinDepthLimit = spec && depthMinRaw > 0.01 && Math.abs(depthClamped - depthMinBound) < 0.01;
  const atMaxDepthLimit = spec && Math.abs(depthClamped - depthMaxBound) < 0.01 && depthMaxBound > depthMinBound + 0.01;
  // 나무두께 자체가 안전 최소 벽두께(MIN_WALL_MM+0.5)보다 얇으면 상한=하한=0으로 붕괴되어 가공깊이를 아예 조절할 수 없음 —
  // 이 경우 스핀버튼이 비활성화(CncSpinField의 locked 처리)되므로, 왜 안 움직이는지 설명하는 경고가 별도로 필요.
  const depthLocked = spec && depthMaxBound - depthMinBound < 0.01;
  const remaining = Math.max(T - depthClamped, 0);
  const protrusion = spec ? Math.max(spec.shaftD - remaining, 0) : 0;
  const overhang = spec ? Math.max(MOVEMENT_SPEC_COMMON.bodyDepth - depthClamped, 0) : 0;
  const embedMargin = spec ? Math.max(depthClamped - MOVEMENT_SPEC_COMMON.bodyDepth, 0) : 0;
  const wallTooThick = spec && remaining > spec.maxPanelThickness;
  const isDefault = spec && Math.abs(depthClamped - recommendedDepth) < 0.05;

  const selectField = (
    <Field label="무브먼트 선택">
      <select className={inputCls + " w-[480px]"} style={inputStyle} value={inventoryId} onChange={(e) => setInventoryId(e.target.value)}>
        <option value="">선택하세요</option>
        {inventoryMovements.map((m) => (
          <option key={m.id} value={m.id}>
            {(m.model || m.brand) + (m.shaftLength ? `(${m.shaftLength})` : "")}
          </option>
        ))}
      </select>
    </Field>
  );

  return (
    <div className="flex flex-col gap-4">
      <div className="text-sm" style={{ color: "#4F4030" }}>
        두꺼운 판재에 무브먼트를 매립할 때, 뒷면을 얼마나 CNC로 파내야 하는지(가공 깊이) 계산하고,
        <br />
        스핀 버튼으로 직접 조절하며 시뮬레이션해볼 수 있어요.
      </div>

      <div className="flex flex-col gap-3 p-4 rounded border bg-white/70" style={{ borderColor: "#BFAE8C" }}>
        {spec ? (
          <>
            <div className="flex items-start justify-center gap-3">
              <CncSpinField label="나무두께" value={T} onChange={(v) => setPanelThickness(v)} min={T_MIN} max={T_MAX} step={0.5} />
              <CncPocketDiagram T={T} depth={depthClamped} protrusion={protrusion} spec={spec} />
              <CncSpinField label="가공 깊이" value={depthClamped} onChange={(v) => setDepth(v)} min={depthMinBound} max={depthMaxBound} step={0.5} />
            </div>
            {!isDefault && (
              <div className="flex justify-center -mt-1">
                <button
                  type="button"
                  onClick={() => setDepth(recommendedDepth)}
                  className="text-[10px] px-2 py-0.5 rounded border"
                  style={{ borderColor: "#BFAE8C", color: "#7A5230" }}
                >
                  추천 가공깊이({recommendedDepth.toFixed(1)}mm)로 재설정
                </button>
              </div>
            )}

            {selectField}

            <div className="flex flex-col gap-2">
              <div
                className="text-sm px-3 py-2.5 rounded"
                style={
                  atMinDepthLimit || atMaxDepthLimit || depthLocked
                    ? { backgroundColor: "#F3E3D3", color: "#B0503A" }
                    : { backgroundColor: "#E7EFE6", color: "#2B2420" }
                }
              >
                {(atMinDepthLimit || atMaxDepthLimit || depthLocked) && (
                  <div className="flex items-center gap-1 font-semibold mb-1">
                    <AlertTriangle size={13} className="shrink-0" />
                    {depthLocked
                      ? `나무두께(${T.toFixed(1)}mm)가 너무 얇아서 가공깊이를 조절할 수 없어요 — 최소 ${(MIN_WALL_MM + 0.5).toFixed(1)}mm 이상으로 늘려주세요`
                      : atMinDepthLimit
                      ? "가공깊이 하한에 도달했어요 — 더 얕게 파면 축이 표면까지 안 닿아요"
                      : "가공깊이 상한에 도달했어요 — 더 깊게 파면 시계판이 너무 얇아져요"}
                  </div>
                )}
                시계판 두께 : <b>{remaining.toFixed(1)}mm</b>, 나무판 ↔ 시계바늘 Gap : <b>{protrusion.toFixed(1)}mm</b>
              </div>
              <div className="text-xs px-3 py-2 rounded" style={{ backgroundColor: "#F3E3D3", color: "#7A5230" }}>
                {embedMargin > 0
                  ? `무브먼트가 나무 안에 완전히 들어가요 (뒷면 여유 ${embedMargin.toFixed(1)}mm)`
                  : overhang > 0
                  ? `무브먼트가 나무 뒷면보다 ${overhang.toFixed(1)}mm 튀어나와요`
                  : "무브먼트가 뒷면과 정확히 맞아떨어져요"}
              </div>
              {wallTooThick && (
                <div className="text-xs px-3 py-2 rounded flex items-start gap-1.5" style={{ backgroundColor: "#F3E3D3", color: "#B0503A" }}>
                  <AlertTriangle size={13} className="shrink-0 mt-0.5" />
                  시계판 두께({remaining.toFixed(1)}mm)가 이 모델의 한계({spec.maxPanelThickness}mm)보다 두꺼워요 — 축이 표면 위로 충분히 안 나와 조립이 안 될 수 있어요. 가공깊이를 더 키워주세요.
                </div>
              )}
              <div className="text-xs px-3 py-2 rounded" style={{ backgroundColor: "#F7F2E9", color: "#4F4030", border: "1px solid #BFAE8C" }}>
                관통홀은 샤프트({CNC_SHAFT_WIDTH_MM}mm)보다 여유(+{CNC_HOLE_CLEARANCE_MM}mm)를 둔 {CNC_SHAFT_WIDTH_MM + CNC_HOLE_CLEARANCE_MM}mm로 뚫어야 조립돼요 — 이미지의 시계판 구간에서 축 좌우로 보이는 흰 여백이 그 여유폭이에요.
              </div>
            </div>
          </>
        ) : (
          <>
            {selectField}
            {selectedInventoryItem && !spec && (
              <div className="text-xs px-3 py-2 rounded" style={{ backgroundColor: "#F3E3D3", color: "#B0503A" }}>
                이 무브먼트("{selectedInventoryItem.model || selectedInventoryItem.brand}")는 샤프트길이 정보가 없어서 계산할 수 없어요. 재고 수정 화면에서 샤프트길이를 먼저 입력해주세요.
              </div>
            )}
            {!selectedInventoryItem && (
              <div className="text-sm text-center py-6" style={{ color: "#4F4030" }}>
                무브먼트를 선택해주세요.
              </div>
            )}
          </>
        )}
      </div>

      <div
        className="text-[11px] leading-relaxed px-3 py-2 rounded"
        style={{ backgroundColor: "#F7F2E9", color: "#4F4030", border: "1px solid #BFAE8C" }}
      >
시계판 최대두께는 "샤프트길이(D) − {CNC_SHAFT_TO_MAX_PANEL_OFFSET_MM}mm" 공식으로 계산돼요(영타운 12888 시리즈 규격표 샘플 다수값 기준). 목록은 무브먼트 탭에 등록된 제품 중 추시계를 제외하고 보여줘요. 몸체 크기·깊이는 아직 공통 가정값(56×56mm, 깊이 16mm)을 쓰고 있어 실제와 다를 수 있어요.
      </div>
    </div>
  );
}

function ClockPartsLedger() {
  const [loaded, setLoaded] = useState(false);
  const [movements, setMovements] = useState([]);
  const [hands, setHands] = useState([]);
  const [transactions, setTransactions] = useState([]);
  const [deletedSeedKeys, setDeletedSeedKeys] = useState([]); // 사용자가 삭제한 시드 항목의 source(없으면 model) — F5해도 되살아나지 않도록 추적
  const [infoItems, setInfoItems] = useState([]);
  const [editingInfo, setEditingInfo] = useState(null);
  const [infoQuery, setInfoQuery] = useState("");
  const [infoKindFilter, setInfoKindFilter] = useState("전체");
  const [tab, setTab] = useState("movements");
  const [query, setQuery] = useState("");
  const [brandFilter, setBrandFilter] = useState("전체");
  const [colorFilter, setColorFilter] = useState("전체");
  const [lengthBucket, setLengthBucket] = useState("전체");
  // 축종류(태양축/정공축)·소음종류(무소음/일반형)는 한 필드의 반대값 쌍이라 XOR: 둘 다 체크 해제(또는 둘 다 체크)면 전체 표시,
  // 하나만 체크하면 그것만. 진자형/Reverse는 서로 다른 독립 필드라 각각 체크 시 그 값이 true인 것만(AND) 걸러냄.
  const [filterTaeyangAxis, setFilterTaeyangAxis] = useState(true); // 태양축 — 기본 체크(현재 데이터가 전부 태양축이라 기본값 그대로 전체가 보임)
  const [filterJeonggongAxis, setFilterJeonggongAxis] = useState(false); // 정공축
  const [filterMusoumOnly, setFilterMusoumOnly] = useState(false); // 무소음
  const [filterIlbanOnly, setFilterIlbanOnly] = useState(false); // 일반형
  const [filterPendulumOnly, setFilterPendulumOnly] = useState(false); // 진자형
  const [filterReverseOnly, setFilterReverseOnly] = useState(false); // Reverse
  const [shaftLengthFilter, setShaftLengthFilter] = useState("전체");
  const [sortZeroLast, setSortZeroLast] = useState(false);
  const [sortByStockDesc, setSortByStockDesc] = useState(false);
  const [editing, setEditing] = useState(null); // {kind, item} or {kind, item:null} for new
  const [stockTarget, setStockTarget] = useState(null); // {kind, item}
  const [error, setError] = useState("");
  const [githubSettings, setGithubSettings] = useState({ owner: "", repo: "", branch: "main", token: "" });
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [toast, setToast] = useState("");

  // GitHub 데이터 동기화 상태 — "한 기기씩만 사용" 전제로, persist()마다 push하고 연결 시점에 pull한다.
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | synced | error
  const [syncedAt, setSyncedAt] = useState(null);
  const [syncErrorMsg, setSyncErrorMsg] = useState("");
  const ledgerShaRef = useRef(null); // GitHub 파일의 현재 sha — 업데이트할 때마다 필요
  const ledgerSnapshotRef = useRef({ movements: [], hands: [], transactions: [], infoItems: [], deletedSeedKeys: [] });

  // 매 변경마다 현재 스냅샷을 그대로 push — 다른 곳에서 이미 바뀐 상태면(409) sha를 다시 받아 한 번만 재시도.
  const pushLedgerToGithub = useCallback(
    async (isRetry) => {
      if (!(githubSettings.owner && githubSettings.repo && githubSettings.token)) return;
      setSyncStatus("syncing");
      try {
        const newSha = await githubPushLedger(githubSettings, ledgerSnapshotRef.current, ledgerShaRef.current);
        ledgerShaRef.current = newSha;
        setSyncStatus("synced");
        setSyncedAt(new Date());
      } catch (e) {
        if (e.status === 409 && !isRetry) {
          try {
            const fresh = await githubFetchLedger(githubSettings);
            ledgerShaRef.current = fresh.sha;
            await pushLedgerToGithub(true);
            return;
          } catch (e2) {
            setSyncStatus("error");
            setSyncErrorMsg(e2.message || "동기화 실패");
            return;
          }
        }
        setSyncStatus("error");
        setSyncErrorMsg(e.message || "동기화 실패");
      }
    },
    [githubSettings]
  );

  // 연결 시점(최초 로드 또는 설정 저장)에 호출 — 원격에 데이터가 있으면 그걸 우선(pull), 없으면 지금 이 기기의 데이터를 최초 업로드.
  const syncWithGithub = useCallback(async (gh) => {
    if (!(gh.owner && gh.repo && gh.token)) return;
    setSyncStatus("syncing");
    try {
      const remote = await githubFetchLedger(gh);
      if (remote.data) {
        const next = {
          movements: remote.data.movements || [],
          hands: remote.data.hands || [],
          transactions: remote.data.transactions || [],
          infoItems: remote.data.infoItems || [],
          deletedSeedKeys: remote.data.deletedSeedKeys || [],
        };
        setMovements(next.movements);
        setHands(next.hands);
        setTransactions(next.transactions);
        setInfoItems(next.infoItems);
        setDeletedSeedKeys(next.deletedSeedKeys);
        saveKey("movements", next.movements);
        saveKey("hands", next.hands);
        saveKey("transactions", next.transactions);
        saveKey("infoItems", next.infoItems);
        saveKey("deletedSeedKeys", next.deletedSeedKeys);
        ledgerSnapshotRef.current = next;
        ledgerShaRef.current = remote.sha;
      } else {
        // 원격에 아직 파일이 없으면(최초 연결) 지금 이 기기의 데이터를 그대로 처음 업로드
        const newSha = await githubPushLedger(gh, ledgerSnapshotRef.current, null);
        ledgerShaRef.current = newSha;
      }
      setSyncStatus("synced");
      setSyncedAt(new Date());
    } catch (e) {
      setSyncStatus("error");
      setSyncErrorMsg(e.message || "동기화 실패");
    }
  }, []);

  const forceUploadToGithub = useCallback(async (gh) => {
    if (!(gh.owner && gh.repo && gh.token)) return;
    setSyncStatus("syncing");
    try {
      let sha = null;
      try {
        const remote = await githubFetchLedger(gh);
        sha = remote.sha;
      } catch (e) {
        // 조회 실패해도 sha 없이 새로 생성 시도
      }
      const newSha = await githubPushLedger(gh, ledgerSnapshotRef.current, sha);
      ledgerShaRef.current = newSha;
      setSyncStatus("synced");
      setSyncedAt(new Date());
    } catch (e) {
      setSyncStatus("error");
      setSyncErrorMsg(e.message || "동기화 실패");
    }
  }, []);

  // 틀고정(sticky) 스택 — 탭바/필터바 높이를 실측해서 그 아래 요소들의 top을 정함.
  // 고정 px값을 쓰면 탭 버튼이 좁은 창에서 2줄로 줄바꿈될 때 높이가 달라져 어긋나므로 직접 측정한다.
  // (ResizeObserver를 먼저 시도했으나 이 앱을 미리보기하는 자동화 브라우저 환경에서 콜백이 전혀 발화하지 않는
  // 문제가 있어— 실제 사용 환경에서도 신뢰할 수 있는 useLayoutEffect의 동기 measure 방식으로 교체함)
  const tabBarRef = useRef(null);
  const filterBarRef = useRef(null);
  const [tabBarHeight, setTabBarHeight] = useState(65);
  const [filterBarHeight, setFilterBarHeight] = useState(58);

  useLayoutEffect(() => {
    const measure = () => {
      if (tabBarRef.current) {
        const h = Math.ceil(tabBarRef.current.getBoundingClientRect().height);
        setTabBarHeight((prev) => (prev === h ? prev : h));
      }
      if (filterBarRef.current) {
        const h = Math.ceil(filterBarRef.current.getBoundingClientRect().height);
        setFilterBarHeight((prev) => (prev === h ? prev : h));
      }
    };
    measure();
    // 동기 측정 한 번만으로는 레이아웃이 아직 최종 확정되기 전 높이를 잡을 수 있어(예: 폰트 로딩, Tailwind 클래스 적용 타이밍),
    // 약간의 지연을 두고 다시 재측정해서 보정. requestAnimationFrame은 일부 환경(예: 비가시 상태의 백그라운드 렌더링)에서
    // 전혀 발화하지 않는 걸 확인해서 setTimeout으로 대체 — 이건 렌더링 루프와 무관하게 항상 동작한다.
    const t1 = setTimeout(measure, 50);
    const t2 = setTimeout(measure, 300);
    window.addEventListener("resize", measure);
    return () => {
      clearTimeout(t1);
      clearTimeout(t2);
      window.removeEventListener("resize", measure);
    };
  });

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2500);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    (async () => {
      try {
        const data = await loadAll();
        const deletedKeys = new Set(data.deletedSeedKeys || []);
        setDeletedSeedKeys(data.deletedSeedKeys || []);
        const mergedMovements = mergeSeeds(data.movements, SEED_MOVEMENTS, emptyMovement, deletedKeys);
        const mergedHands = mergeSeeds(data.hands, SEED_HANDS, emptyHand, deletedKeys);
        let colorChanged = false;
        const normalizedHands = mergedHands.map((h) => {
          const nc = normalizeColor(h.color);
          if (nc !== h.color) {
            colorChanged = true;
            return { ...h, color: nc };
          }
          return h;
        });
        let movementsChanged = false;
        const normalizedMovements = mergedMovements.map((m) => {
          const next = { ...m };
          let changed = false;
          if (!next.category) {
            next.category = next.brand === "기타" ? "기타" : "무브먼트";
            changed = true;
          }
          if (!next.shaftLength) {
            const text = `${next.model || ""} ${next.note || ""}`;
            const mm = text.match(/(\d+)\s*mm/);
            next.shaftLength = mm ? `${mm[1]}mm` : "14mm";
            changed = true;
          }
          if (!next.noiseType) {
            const text = `${next.model || ""} ${next.note || ""}`;
            next.noiseType = text.includes("무소음") ? "무소음" : "일반형";
            changed = true;
          }
          if (!next.axisType) {
            next.axisType = "태양축";
            changed = true;
          }
          if (changed) movementsChanged = true;
          return changed ? next : m;
        });
        setMovements(normalizedMovements);
        setHands(normalizedHands);
        setTransactions(data.transactions);
        // 중요도(priority) 필드 도입 이전에 등록된 기존 자료는 같은 종류 안에서 등록 순서대로 1,2,3...을 부여
        let infoChanged = false;
        const kindCounters = {};
        const normalizedInfoItems = data.infoItems.map((i) => {
          if (i.priority !== undefined && i.priority !== null && i.priority !== "") return i;
          infoChanged = true;
          kindCounters[i.kind] = (kindCounters[i.kind] || 0) + 1;
          return { ...i, priority: kindCounters[i.kind] };
        });
        setInfoItems(normalizedInfoItems);
        if (mergedMovements !== data.movements || movementsChanged) saveKey("movements", normalizedMovements);
        if (mergedHands !== data.hands || colorChanged) saveKey("hands", normalizedHands);
        if (infoChanged) saveKey("infoItems", normalizedInfoItems);
        ledgerSnapshotRef.current = {
          movements: normalizedMovements,
          hands: normalizedHands,
          transactions: data.transactions,
          infoItems: normalizedInfoItems,
          deletedSeedKeys: data.deletedSeedKeys || [],
        };
        const gh = loadGithubSettingsLS();
        if (gh) setGithubSettings(gh);
        if (gh && gh.owner && gh.repo && gh.token) await syncWithGithub(gh);
      } catch (e) {
        setError("저장된 데이터를 불러오지 못했어요.");
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const saveGithubSettings = (s) => {
    setGithubSettings(s);
    saveGithubSettingsLS(s);
    setSettingsOpen(false);
    syncWithGithub(s);
  };

  // 복구용 — 다른 기기가 잘못된 데이터를 먼저 올려버렸을 때, 지금 이 기기 데이터로 GitHub를 강제로 덮어씀
  const forceUploadGithubSettings = (s) => {
    setGithubSettings(s);
    saveGithubSettingsLS(s);
    setSettingsOpen(false);
    forceUploadToGithub(s);
  };

  const persist = useCallback(
    (key, val) => {
      ledgerSnapshotRef.current = { ...ledgerSnapshotRef.current, [key]: val };
      saveKey(key, val);
      pushLedgerToGithub();
    },
    [pushLedgerToGithub]
  );

  /* ---- CRUD ---- */
  const saveMovement = (f) => {
    const cleaned = { ...f, stock: Number(f.stock) || 0 };
    setMovements((prev) => {
      const exists = prev.some((m) => m.id === cleaned.id);
      const next = exists ? prev.map((m) => (m.id === cleaned.id ? cleaned : m)) : [cleaned, ...prev];
      persist("movements", next);
      setToast(exists ? "수정 내용을 저장했어요." : "새 무브먼트를 등록했어요.");
      return next;
    });
    setEditing(null);
  };

  const saveHand = (f) => {
    const cleaned = { ...f, stock: Number(f.stock) || 0 };
    setHands((prev) => {
      const exists = prev.some((h) => h.id === cleaned.id);
      const next = exists ? prev.map((h) => (h.id === cleaned.id ? cleaned : h)) : [cleaned, ...prev];
      persist("hands", next);
      setToast(exists ? "수정 내용을 저장했어요." : "새 시계바늘을 등록했어요.");
      return next;
    });
    setEditing(null);
  };

  // 수정 화면에서 분류(A/B타입·무브먼트·기타)를 바꿔 다른 배열로 이동시킬 때 사용
  const saveEditedItem = (removeFromKind, id, newKind, data) => {
    if (newKind === "movement") {
      saveMovement(data);
    } else {
      saveHand(data);
    }
    if (removeFromKind === "hand") {
      setHands((prev) => {
        const next = prev.filter((h) => h.id !== id);
        persist("hands", next);
        return next;
      });
      setToast("다른 분류로 재등록했어요.");
    } else if (removeFromKind === "movement") {
      setMovements((prev) => {
        const next = prev.filter((m) => m.id !== id);
        persist("movements", next);
        return next;
      });
      setToast("다른 분류로 재등록했어요.");
    }
  };

  // 삭제한 항목이 SEED_MOVEMENTS/SEED_HANDS의 시드였다면 그 키(source, 없으면 model)를 기록해둬서
  // 다음 로드 때 mergeSeeds가 다시 추가하지 않도록 함 — "삭제해도 F5하면 되살아나는" 버그 수정.
  const recordDeletedKeys = (items) => {
    const keys = items.map((it) => it.source || it.model).filter(Boolean);
    if (!keys.length) return;
    setDeletedSeedKeys((prev) => {
      const next = Array.from(new Set([...prev, ...keys]));
      persist("deletedSeedKeys", next);
      return next;
    });
  };

  const deleteMovement = (id) => {
    setMovements((prev) => {
      const target = prev.find((m) => m.id === id);
      const next = prev.filter((m) => m.id !== id);
      persist("movements", next);
      if (target) recordDeletedKeys([target]);
      return next;
    });
    setToast("삭제했어요.");
  };
  const deleteMiscAll = () => {
    const count = movements.filter((m) => (m.category || "무브먼트") === "기타").length;
    if (count === 0) return;
    if (!window.confirm(`기타 항목 ${count}개를 모두 삭제할까요?\n삭제하면 되돌릴 수 없어요.`)) return;
    setMovements((prev) => {
      const targets = prev.filter((m) => (m.category || "무브먼트") === "기타");
      const next = prev.filter((m) => (m.category || "무브먼트") !== "기타");
      persist("movements", next);
      recordDeletedKeys(targets);
      return next;
    });
    setToast("기타 항목을 모두 삭제했어요.");
  };
  const deleteHand = (id) => {
    setHands((prev) => {
      const target = prev.find((h) => h.id === id);
      const next = prev.filter((h) => h.id !== id);
      persist("hands", next);
      if (target) recordDeletedKeys([target]);
      return next;
    });
    setToast("삭제했어요.");
  };

  const saveInfoItem = (data) => {
    const exists = infoItems.some((i) => i.id === data.id);
    setInfoItems((prev) => {
      const next = exists ? prev.map((i) => (i.id === data.id ? data : i)) : [data, ...prev];
      persist("infoItems", next);
      return next;
    });
    setEditingInfo(null);
    setToast(exists ? "수정했어요." : "등록했어요.");
  };
  const deleteInfoItem = (id) => {
    setInfoItems((prev) => {
      const next = prev.filter((i) => i.id !== id);
      persist("infoItems", next);
      return next;
    });
    setToast("삭제했어요.");
  };

  const commitStock = (kind, item, dir, qty, note, date) => {
    const delta = dir === "in" ? qty : -qty;
    const newStock = Math.max(0, (Number(item.stock) || 0) + delta);
    if (kind === "movement") {
      setMovements((prev) => {
        const next = prev.map((m) => (m.id === item.id ? { ...m, stock: newStock } : m));
        persist("movements", next);
        return next;
      });
    } else {
      setHands((prev) => {
        const next = prev.map((h) => (h.id === item.id ? { ...h, stock: newStock } : h));
        persist("hands", next);
        return next;
      });
    }
    const tx = {
      id: uid(),
      kind,
      itemId: item.id,
      label:
        kind === "movement" ? `${item.brand} · ${item.shaftLength || "-"}` : `${item.type} ${item.length}mm`,
      dir,
      qty,
      note,
      date: date ? new Date(`${date}T${new Date().toTimeString().slice(0, 8)}`).toISOString() : new Date().toISOString(),
    };
    setTransactions((prev) => {
      const next = [tx, ...prev].slice(0, 500);
      persist("transactions", next);
      return next;
    });
    setStockTarget(null);
  };

  /* ---- filtering ---- */
  const zeroLastCompare = (a, b) => ((Number(a.stock) || 0) === 0 ? 1 : 0) - ((Number(b.stock) || 0) === 0 ? 1 : 0);
  const stockDescCompare = (a, b) => (Number(b.stock) || 0) - (Number(a.stock) || 0);

  const filteredMovements = useMemo(() => {
    const activeCategory = tab === "movements" ? "무브먼트" : tab === "misc" ? "기타" : null;
    const list = movements.filter((m) => {
      if (activeCategory && (m.category || "무브먼트") !== activeCategory) return false;
      if (brandFilter !== "전체" && m.brand !== brandFilter) return false;
      if (query && !(`${m.model || ""} ${m.brand} ${m.note}`.toLowerCase().includes(query.toLowerCase()))) return false;
      if (filterTaeyangAxis !== filterJeonggongAxis) {
        if (filterTaeyangAxis && m.axisType !== "태양축") return false;
        if (filterJeonggongAxis && m.axisType !== "정공축") return false;
      }
      if (filterMusoumOnly !== filterIlbanOnly) {
        if (filterMusoumOnly && m.noiseType !== "무소음") return false;
        if (filterIlbanOnly && m.noiseType !== "일반형") return false;
      }
      if (filterPendulumOnly && !m.pendulum) return false;
      if (filterReverseOnly && !m.reverse) return false;
      if (shaftLengthFilter !== "전체" && m.shaftLength !== shaftLengthFilter) return false;
      return true;
    });
    // 제품명 끝에 붙은 길이 표기("14mm" 등)를 뗀 "기본 이름"으로 먼저 그룹을 묶고, 그 안에서 샤프트길이 오름차순 —
    // 예: "고급형 무소음 무브먼트14mm"와 "...19mm"는 전체 문자열은 다르지만 같은 제품의 길이만 다른 것이므로 같은 그룹으로 처리.
    const baseModelName = (m) => (m.model || "").replace(/\s*\d+\s*mm\s*$/i, "").trim();
    const sorted = sortByStockDesc
      ? [...list].sort(stockDescCompare)
      : [...list].sort((a, b) => {
          const baseCompare = baseModelName(a).localeCompare(baseModelName(b), "ko");
          if (baseCompare !== 0) return baseCompare;
          return (parseInt(a.shaftLength, 10) || 0) - (parseInt(b.shaftLength, 10) || 0);
        });
    return sortZeroLast ? [...sorted].sort(zeroLastCompare) : sorted;
  }, [
    movements,
    tab,
    brandFilter,
    query,
    filterTaeyangAxis,
    filterJeonggongAxis,
    filterMusoumOnly,
    filterIlbanOnly,
    filterPendulumOnly,
    filterReverseOnly,
    shaftLengthFilter,
    sortZeroLast,
    sortByStockDesc,
  ]);

  const filteredHands = useMemo(() => {
    const activeType = tab === "handsA" ? "A타입" : tab === "handsB" ? "B타입" : null;
    const bucket = HAND_LENGTH_BUCKETS.find((b) => b.key === lengthBucket);
    const filtered = hands.filter((h) => {
      if (activeType && h.type !== activeType) return false;
      if (query && !(`${h.model || ""} ${h.type} ${h.color} ${h.note}`.toLowerCase().includes(query.toLowerCase()))) return false;
      if (colorFilter !== "전체" && h.color !== colorFilter) return false;
      const len = Number(h.length);
      if (bucket && !bucket.test(len)) return false;
      return true;
    });
    const list = sortByStockDesc
      ? [...filtered].sort(stockDescCompare)
      : [...filtered].sort((a, b) => (Number(a.length) || 0) - (Number(b.length) || 0));
    return sortZeroLast ? [...list].sort(zeroLastCompare) : list;
  }, [hands, tab, query, colorFilter, lengthBucket, sortZeroLast, sortByStockDesc]);

  const resetFilters = () => {
    setQuery("");
    setBrandFilter("전체");
    setColorFilter("전체");
    setLengthBucket("전체");
    setFilterTaeyangAxis(true); // 기본값: 태양축 체크(현재 데이터 기준 전체 표시와 동일)
    setFilterJeonggongAxis(false);
    setFilterMusoumOnly(false);
    setFilterIlbanOnly(false);
    setFilterPendulumOnly(false);
    setFilterReverseOnly(false);
    setShaftLengthFilter("전체");
    setSortZeroLast(false);
    setSortByStockDesc(false);
    setInfoQuery("");
    setInfoKindFilter("전체");
  };

  const filteredInfoItems = infoItems.filter((i) => {
    if (infoKindFilter !== "전체" && i.kind !== infoKindFilter) return false;
    if (infoQuery.trim() && !(`${i.title} ${i.description}`.toLowerCase().includes(infoQuery.trim().toLowerCase()))) return false;
    return true;
  });

  const buildFilterSummary = (count, parts) => (parts.length ? `${parts.join(" ")} ${count}개 검색됨` : `${count}개`);

  const movementFilterParts = [];
  if (tab === "movements") {
    if (brandFilter !== "전체") movementFilterParts.push(brandFilter);
    if (shaftLengthFilter !== "전체") movementFilterParts.push(shaftLengthFilter);
    if (filterTaeyangAxis !== filterJeonggongAxis) movementFilterParts.push(filterTaeyangAxis ? "태양축" : "정공축");
    if (filterMusoumOnly !== filterIlbanOnly) movementFilterParts.push(filterMusoumOnly ? "무소음" : "일반형");
    if (filterPendulumOnly) movementFilterParts.push("진자형");
    if (filterReverseOnly) movementFilterParts.push("Reverse");
  }
  if (query.trim()) movementFilterParts.push(`"${query.trim()}"`);

  const handFilterParts = [];
  if (colorFilter !== "전체") handFilterParts.push(colorFilter);
  if (lengthBucket !== "전체") {
    const b = HAND_LENGTH_BUCKETS.find((x) => x.key === lengthBucket);
    if (b) handFilterParts.push(b.label);
  }
  if (query.trim()) handFilterParts.push(`"${query.trim()}"`);

  const brandFilterOptions = useMemo(() => {
    const extra = Array.from(new Set(movements.map((m) => m.brand).filter(Boolean))).filter(
      (b) => !BRANDS.includes(b)
    );
    return [...BRANDS, ...extra.sort()];
  }, [movements]);

  const shaftLengthFilterOptions = useMemo(() => {
    const extra = Array.from(new Set(movements.map((m) => m.shaftLength).filter(Boolean))).filter(
      (s) => !SHAFT_LENGTHS.includes(s)
    );
    const sortByNumber = (a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0);
    return [...SHAFT_LENGTHS, ...extra].sort(sortByNumber);
  }, [movements]);

  const colorFilterOptions = useMemo(() => {
    const extra = Array.from(new Set(hands.map((h) => h.color).filter(Boolean))).filter(
      (c) => !HAND_COLORS.includes(c)
    );
    return [...HAND_COLORS, ...extra.sort()];
  }, [hands]);

  const lowStockCount = useMemo(
    () => [...movements, ...hands].filter((i) => Number(i.stock) <= 2).length,
    [movements, hands]
  );

  const groupedTransactions = useMemo(() => {
    const groups = [];
    let currentKey = null;
    let currentGroup = null;
    transactions.forEach((t) => {
      const d = new Date(t.date);
      const key = d.toDateString();
      if (key !== currentKey) {
        currentKey = key;
        currentGroup = {
          key,
          label: d.toLocaleDateString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" }),
          items: [],
        };
        groups.push(currentGroup);
      }
      currentGroup.items.push(t);
    });
    return groups;
  }, [transactions]);

  const renderEditForm = () => {
    if (!editing) return null;

              <div className="flex justify-between items-center">
                <span className="text-sm" style={{ color: "#4F4030" }}>
                  자주 쓰는 사이트, 매뉴얼 문서, 참고 이미지를 등록해두는 곳이에요.
                </span>
                <button
                  onClick={() => setEditingInfo(emptyInfoItem())}
                  className="flex items-center gap-1 px-3 py-1.5 rounded text-sm text-white"
                  style={{ backgroundColor: "#7A5230" }}
                >
                  <Plus size={14} /> 등록
                </button>
              </div>
              <div className="flex flex-wrap items-center gap-1">
                <div className="relative w-40 shrink-0">
                  <Search size={12} className="absolute left-2 top-1/2 -translate-y-1/2 text-[#4F4030]" />
                  <input
                    className={inputCls + " pl-6 w-full"}
                    style={filterInputStyle}
                    placeholder="제목/소개 검색"
                    value={infoQuery}
                    onChange={(e) => setInfoQuery(e.target.value)}
                  />
                </div>
                <select
                  className={inputCls + " w-20"}
                  style={filterInputStyle}
                  value={infoKindFilter}
                  onChange={(e) => setInfoKindFilter(e.target.value)}
                >
                  <option>전체</option>
                  {INFO_KINDS.map((k) => (
                    <option key={k}>{k}</option>
                  ))}
                </select>
              </div>
              {editingInfo && !filteredInfoItems.some((i) => i.id === editingInfo.id) && (
                <InfoItemForm
                  initial={editingInfo}
                  onSave={saveInfoItem}
                  onCancel={() => setEditingInfo(null)}
                  isEdit={infoItems.some((i) => i.id === editingInfo.id)}
                  infoItems={infoItems}
                />
              )}
              {filteredInfoItems.length === 0 ? (
                <div className="text-sm text-center py-8" style={{ color: "#4F4030" }}>
                  {infoItems.length === 0
                    ? "등록된 자료가 없어요. 자주 쓰는 사이트, 매뉴얼, 참고 이미지를 등록해보세요."
                    : "검색 조건에 맞는 자료가 없어요."}
                </div>
              ) : (
                INFO_KINDS.map((k) => {
                  const items = filteredInfoItems
                    .filter((i) => i.kind === k)
                    .sort((a, b) => (Number(a.priority) || 0) - (Number(b.priority) || 0));
                  if (items.length === 0) return null;
                  return (
                    <div key={k} className="flex flex-col gap-2">
                      <div className="text-xs font-semibold px-1 pb-1 border-b" style={{ color: "#463823", borderColor: "#BFAE8C" }}>
                        {k} · {items.length}건
                      </div>
                      {items.map((item) => (
                        <React.Fragment key={item.id}>
                          {editingInfo && editingInfo.id === item.id && (
                            <div className="mb-1">
                              <InfoItemForm
                                initial={editingInfo}
                                onSave={saveInfoItem}
                                onCancel={() => setEditingInfo(null)}
                                isEdit
                                infoItems={infoItems}
                              />
                            </div>
                          )}
                          <InfoItemCard item={item} onEdit={(it) => setEditingInfo(it)} onDelete={deleteInfoItem} />
                        </React.Fragment>
                      ))}
                    </div>
                  );
                })
              )}
            </div>
          )}

          {tab === "cnc" && <CncCalcSection movements={movements} />}
        </div>

        {error && <div className="mt-3 text-xs text-center" style={{ color: "#B0503A" }}>{error}</div>}
      </div>

      {stockTarget && (
        <StockModal
          item={stockTarget.item}
          kind={stockTarget.kind}
          onClose={() => setStockTarget(null)}
          onCommit={(dir, qty, note, date) => commitStock(stockTarget.kind, stockTarget.item, dir, qty, note, date)}
        />
      )}

      {settingsOpen && (
        <SettingsModal
          initial={githubSettings}
          onClose={() => setSettingsOpen(false)}
          onSave={saveGithubSettings}
          onForceUpload={forceUploadGithubSettings}
        />
      )}

      {toast && (
        <div
          className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg shadow-lg text-sm flex items-center gap-2"
          style={{ backgroundColor: "#5B7B5A", color: "white" }}
        >
          <CheckCircle2 size={15} /> {toast}
        </div>
      )}
    </div>
    </GithubSettingsContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ClockPartsLedger />);
</script>
